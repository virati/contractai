[project]
name = "contractai"
version = "0.1.0"
description = "A contract assessment application using DSPy agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "dspy-ai>=2.4.0",
    "python-docx>=1.0.0",
    "PyPDF2>=3.0.0",
    "attachments>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"
